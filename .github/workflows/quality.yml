name: quality

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test algorithm traces
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npm run doctor
